<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rischiatutto - Tabellone TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #020617, #0f172a, #020617); color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    
    header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); padding: 15px 25px; border-radius: 16px; border: 1px solid #1e293b; margin-bottom: 20px; }
    .logo { font-size: 24px; font-weight: 900; color: #fbbf24; tracking-wide: 1px; }
    .pin-box { background: #020617; padding: 8px 20px; border-radius: 12px; border: 1px solid #f59e0b; text-align: right; }
    .pin-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
    .pin-code { font-size: 28px; font-weight: 900; color: #fbbf24; font-family: monospace; }

    main { display: grid; grid-template-columns: 1fr; gap: 20px; flex-grow: 1; }
    @media (min-width: 1024px) { main { grid-template-columns: 3fr 1fr; } }

    .board-container { background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; border-radius: 24px; padding: 20px; position: relative; min-height: 500px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; width: 100%; }
    .cat-column { display: flex; flex-direction: column; gap: 10px; }
    .cat-title { background: #1e1b4b; border: 1px solid #4338ca; color: #fde047; font-weight: 900; text-align: center; padding: 12px; border-radius: 12px; font-size: 13px; text-transform: uppercase; height: 50px; display: flex; align-items: center; justify-content: center; }
    
    .btn-points { background: #020617; color: #fbbf24; font-weight: 900; font-size: 22px; padding: 18px 0; border-radius: 14px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.2s; }
    .btn-points:hover { background: #f59e0b; color: #020617; border-color: #fbbf24; transform: scale(1.03); }
    .btn-points:disabled { background: rgba(15, 23, 42, 0.4); color: #475569; border-color: #0f172a; cursor: not-allowed; text-decoration: line-through; transform: none; }

    /* Overlay Domanda con Effetto Pop-up */
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.96); border: 2px solid #f59e0b; border-radius: 24px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; z-index: 20; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .overlay.hidden { transform: scale(0); opacity: 0; pointer-events: none; }
    .overlay.visible { transform: scale(1); opacity: 1; pointer-events: auto; }

    .badge { background: #f59e0b; color: #020617; font-weight: 900; font-size: 16px; padding: 6px 20px; border-radius: 20px; text-transform: uppercase; }
    .question-text { font-size: 32px; font-weight: 800; color: #f8fafc; margin: auto; max-width: 800px; line-height: 1.4; }
    .buzzer-status { width: 100%; max-width: 600px; padding: 15px; border-radius: 16px; background: #0f172a; border: 1px solid #1e293b; font-size: 20px; font-weight: 800; color: #94a3b8; }
    .buzzer-status.booked { background: #450a0a; border-color: #ef4444; color: #fca5a5; animation: pulse 1s infinite; }

    .sidebar { background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar h2 { font-size: 18px; color: #818cf8; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .player-row { display: flex; justify-content: space-between; background: #020617; padding: 12px 16px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 8px; font-weight: bold; }
    .player-pts { color: #34d399; font-family: monospace; font-size: 18px; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>

  <header>
    <div class="logo">📺 RISCHIATUTTO</div>
    <div class="pin-box">
      <div class="pin-label">Codice Stanza</div>
      <div id="codice-stanza" class="pin-code">----</div>
    </div>
  </header>

  <main>
    <div id="tabellone-container" class="board-container">
      <!-- Griglia Categorie e Domande -->
      <div id="griglia-tabellone" class="grid"></div>

      <!-- Pop-up Domanda -->
      <div id="overlay-domanda" class="overlay hidden">
        <div style="margin-top: 20px;">
          <span id="domanda-badge" class="badge">CATEGORIA - 000 PT</span>
        </div>
        <div id="domanda-testo" class="question-text">Caricamento domanda...</div>
        <div id="box-prenotazione" class="buzzer-status">
          🔔 BUZZER ATTIVO! In attesa di prenotazione...
        </div>
      </div>
    </div>

    <!-- Sidebar Classifica -->
    <div class="sidebar">
      <div>
        <h2>🏆 Classifica</h2>
        <div id="lista-classifica">
          <div style="color: #64748b; text-align: center; padding: 20px;">Nessun giocatore connesso</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Gestione Errori di Emergenza visibile a schermo
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = `<div style="color:red; background:#000; padding:20px; font-size:20px;">
        ⚠️ Errore nel Tabellone: ${msg}<br><small>Linea: ${line}</small>
      </div>`;
    };

    const codiceStanza = Math.floor(1000 + Math.random() * 9000).toString();

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('codice-stanza').innerText = codiceStanza;

      let socket;
      try {
        socket = io();
        socket.emit('uniscitiStanza', { codiceStanza, ruoli: 'tabellone' });
      } catch(e) {
        console.error("Socket.io non connesso", e);
      }

      let elencoCategorie = [];

      // Carica il file domande.json
      fetch('/domande.json')
        .then(res => {
          if (!res.ok) throw new Error("File domande.json non trovato in public/");
          return res.json();
        })
        .then(data => {
          elencoCategorie = data.categorie;
          costruisciGriglia(data.categorie, socket);
        })
        .catch(err => {
          document.getElementById('griglia-tabellone').innerHTML = `<div style="color:#ef4444; font-weight:bold; grid-column: 1/-1; text-align:center;">
            ❌ Impossibile caricare domande.json da public/<br>${err.message}
          </div>`;
        });

      function costruisciGriglia(categorie, socketInstance) {
        const container = document.getElementById('griglia-tabellone');
        container.innerHTML = '';

        categorie.forEach((cat, indexCat) => {
          const col = document.createElement('div');
          col.className = 'cat-column';

          const title = document.createElement('div');
          title.className = 'cat-title';
          title.innerText = cat.nome;
          col.appendChild(title);

          cat.domande.forEach((d, indexDom) => {
            const btn = document.createElement('button');
            btn.className = 'btn-points';
            btn.innerText = d.punti;
            btn.id = `btn-${indexCat}-${indexDom}`;

            btn.onclick = (e) => {
              btn.disabled = true;

              // Origine animazione pop-up dal pulsante
              const rect = btn.getBoundingClientRect();
              const containerRect = document.getElementById('tabellone-container').getBoundingClientRect();
              const x = (rect.left + rect.width / 2) - containerRect.left;
              const y = (rect.top + rect.height / 2) - containerRect.top;
              document.getElementById('overlay-domanda').style.transformOrigin = `${x}px ${y}px`;

              if (socketInstance) {
                socketInstance.emit('selezionaDomanda', {
                  categoria: cat.nome,
                  punti: d.punti,
                  testo: d.testo,
                  risposta: d.risposta
                });
              }
            };
            col.appendChild(btn);
          });

          container.appendChild(col);
        });
      }

      // Eventi Socket.IO
      if (socket) {
        socket.on('apriDomanda', (data) => {
          document.getElementById('domanda-badge').innerText = `${data.categoria} - ${data.punti} PT`;
          document.getElementById('domanda-testo').innerText = data.testo;
          
          const overlay = document.getElementById('overlay-domanda');
          overlay.classList.remove('hidden');
          overlay.classList.add('visible');
        });

        socket.on('chiudiDomanda', (data) => {
          const overlay = document.getElementById('overlay-domanda');
          overlay.classList.remove('visible');
          overlay.classList.add('hidden');
          if (data.punteggi) aggiornaClassifica(data.punteggi);
        });

        socket.on('giocatorePrenotato', (nick) => {
          const box = document.getElementById('box-prenotazione');
          box.className = 'buzzer-status booked';
          box.innerText = `🚨 PRENOTATO: ${nick.toUpperCase()}`;
        });

        socket.on('resetBuzzer', () => {
          const box = document.getElementById('box-prenotazione');
          box.className = 'buzzer-status';
          box.innerText = '🔔 BUZZER ATTIVO! In attesa di prenotazione...';
        });

        socket.on('aggiornaPunteggi', (punteggi) => aggiornaClassifica(punteggi));
      }

      function aggiornaClassifica(punteggi) {
        const container = document.getElementById('lista-classifica');
        const entries = Object.entries(punteggi);
        if (entries.length === 0) return;

        entries.sort((a, b) => b[1] - a[1]);

        container.innerHTML = entries.map(([nick, pt], i) => `
          <div class="player-row">
            <span>#${i + 1} ${nick}</span>
            <span class="player-pts">${pt} pt</span>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
