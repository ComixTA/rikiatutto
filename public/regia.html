<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rischiatutto - Pannello Regia</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #030712; color: #ffffff; min-height: 100vh; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; background-color: #0f172a; padding: 16px 24px; border-radius: 16px; border: 2px solid #1e293b; margin-bottom: 20px; }
    .logo { font-size: 22px; font-weight: 900; color: #facc15; }
    
    .card { background-color: #0f172a; border: 2px solid #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 14px; text-transform: uppercase; color: #818cf8; font-weight: 800; margin-bottom: 12px; }

    /* FORM ACCESSO STANZA */
    .login-box { max-width: 400px; margin: 40px auto; text-align: center; }
    input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #374151; background: #020617; color: #fff; font-size: 20px; font-weight: bold; text-align: center; margin: 12px 0; font-family: monospace; }
    
    /* BOTTONI AZIONE */
    button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    .btn-primary { background: #f59e0b; color: #000; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #3b82f6; color: #fff; }

    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    /* CONTENUTO DOMANDA */
    .question-box { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .q-text { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .q-answer { font-size: 18px; color: #34d399; font-weight: bold; }
    .q-points { display: inline-block; background: #f59e0b; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 900; font-size: 12px; margin-bottom: 8px; }

    /* NOTIFICA BUZZER */
    .buzzer-alert { background: #450a0a; border: 2px solid #ef4444; color: #fca5a5; padding: 16px; border-radius: 12px; font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎛️ REGIA RISCHIATUTTO</div>
    <div id="stanza-status" style="font-weight: bold; color: #facc15;">Non Connesso</div>
  </header>

  <!-- SCHERMATA LOGIN STANZA -->
  <div id="screen-login" class="card login-box">
    <div class="card-title">Inserisci il PIN del Tabellone</div>
    <input type="text" id="input-pin" maxlength="4" placeholder="Es. 1234">
    <button class="btn-primary" onclick="connettiStanza()">ENTRA IN REGIA</button>
  </div>

  <!-- PANNELLO REGIA ATTIVO -->
  <div id="screen-main" style="display: none;">
    
    <!-- BOX DOMANDA ATTIVA -->
    <div class="card">
      <div class="card-title">Domanda Corrente</div>
      <div id="box-nessuna-domanda" style="color: #64748b; text-align: center; padding: 20px; font-weight: bold;">
        In attesa che venga selezionata una domanda dal Tabellone...
      </div>

      <div id="box-domanda-attiva" style="display: none;">
        <span id="regia-badge" class="q-points">CATEGORIA - 000 PT</span>
        <div class="question-box">
          <div class="q-text" id="regia-testo">Testo domanda...</div>
          <div class="q-answer">Risposta esatta: <span id="regia-risposta">---</span></div>
        </div>

        <!-- NOTIFICA PRENOTAZIONE GIOCATORE -->
        <div id="regia-buzzer-box" style="display: none;" class="buzzer-alert">
          🚨 PRENOTATO: <span id="regia-prenotato-nick">---</span>
        </div>

        <!-- PULSANTI GESTIONE RISPOSTA -->
        <div class="grid-btns">
          <button class="btn-success" onclick="rispostaEsatta()">✅ CORRETTA (+Punti)</button>
          <button class="btn-danger" onclick="rispostaErrata()">❌ ERRATA (-Punti / Riapri)</button>
        </div>
        <div style="margin-top: 12px;">
          <button class="btn-secondary" onclick="chiudiDomanda()">⏹️ CHIUDI DOMANDA</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let socket;
    let stanzaCorrente = "";
    let domandaAttiva = null;
    let giocatorePrenotato = null;

    function connettiStanza() {
      const pin = document.getElementById('input-pin').value.trim();
      if (!pin) return alert("Inserisci il PIN a 4 cifre!");

      stanzaCorrente = pin;
      socket = io();

      socket.emit('uniscitiStanza', { codiceStanza: stanzaCorrente, ruoli: 'regia' });

      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-main').style.display = 'block';
      document.getElementById('stanza-status').innerText = `Stanza: ${stanzaCorrente}`;

      // ASCOLTO EVENTI SERVER
      socket.on('apriDomanda', (data) => {
        domandaAttiva = data;
        giocatorePrenotato = null;

        document.getElementById('box-nessuna-domanda').style.display = 'none';
        document.getElementById('box-domanda-attiva').style.display = 'block';

        document.getElementById('regia-badge').innerText = `${data.categoria} - ${data.punti} PT`;
        document.getElementById('regia-testo').innerText = data.testo;
        document.getElementById('regia-risposta').innerText = data.risposta || "Non specificata";

        document.getElementById('regia-buzzer-box').style.display = 'none';
      });

      socket.on('giocatorePrenotato', (nick) => {
        giocatorePrenotato = nick;
        document.getElementById('regia-prenotato-nick').innerText = nick.toUpperCase();
        document.getElementById('regia-buzzer-box').style.display = 'block';
      });

      socket.on('chiudiDomanda', () => {
        resetStatoDomanda();
      });
    }

    function rispostaEsatta() {
      if (!domandaAttiva || !giocatorePrenotato) {
        return alert("Nessun giocatore si è prenotato col buzzer!");
      }
      socket.emit('confermaRisposta', {
        codiceStanza: stanzaCorrente,
        nick: giocatorePrenotato,
        punti: domandaAttiva.punti,
        esito: true
      });
      resetStatoDomanda();
    }

    function rispostaErrata() {
      if (!domandaAttiva || !giocatorePrenotato) {
        return alert("Nessun giocatore si è prenotato col buzzer!");
      }
      socket.emit('confermaRisposta', {
        codiceStanza: stanzaCorrente,
        nick: giocatorePrenotato,
        punti: domandaAttiva.punti,
        esito: false
      });
      document.getElementById('regia-buzzer-box').style.display = 'none';
      giocatorePrenotato = null;
    }

    function chiudiDomanda() {
      socket.emit('forzaChiudiDomanda', { codiceStanza: stanzaCorrente });
      resetStatoDomanda();
    }

    function resetStatoDomanda() {
      domandaAttiva = null;
      giocatorePrenotato = null;
      document.getElementById('box-nessuna-domanda').style.display = 'block';
      document.getElementById('box-domanda-attiva').style.display = 'none';
    }
  </script>
</body>
</html>
