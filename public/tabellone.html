<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rischiatutto - Tabellone TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-white min-h-screen p-6 flex flex-col justify-between select-none">

  <!-- HEADER CON LOGO E PIN STANZA -->
  <header class="flex justify-between items-center mb-6 bg-gray-900 p-4 rounded-2xl border border-gray-800 shadow-xl">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">📺</span>
      <h1 class="text-3xl font-black text-yellow-400 tracking-wider">RISCHIATUTTO</h1>
    </div>

    <!-- BOX PIN STANZA -->
    <div class="flex items-center space-x-4 bg-gray-950 px-6 py-2 rounded-xl border border-yellow-500/40">
      <div class="text-right">
        <div class="text-xs text-gray-400 uppercase font-bold tracking-widest">Codice Stanza</div>
        <div id="codice-stanza" class="text-3xl font-black text-yellow-400 font-mono">----</div>
      </div>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="grid grid-cols-1 lg:grid-cols-4 gap-6 my-auto">
    
    <!-- GRIGLIA TABELLONE -->
    <div class="lg:col-span-3 bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl relative min-h-[500px] flex items-center justify-center">
      
      <div id="griglia-tabellone" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 w-full">
        <!-- Generato dinamicamente via JS -->
      </div>

      <!-- OVERLAY DOMANDA ATTIVA -->
      <div id="overlay-domanda" class="hidden absolute inset-0 bg-gray-950 rounded-3xl p-8 flex flex-col justify-between items-center text-center z-10 border-2 border-yellow-500">
        <div class="space-y-2 w-full">
          <span id="domanda-categoria-punti" class="inline-block bg-yellow-500 text-gray-950 font-black text-lg px-4 py-1 rounded-full uppercase tracking-widest">
            CATEGORIA - 000 PT
          </span>
          <div id="domanda-testo" class="text-3xl md:text-4xl font-extrabold text-white leading-relaxed pt-6">
            In attesa della domanda...
          </div>
        </div>

        <!-- NOTIFICA PRENOTAZIONE BUZZER -->
        <div id="box-prenotazione" class="w-full max-w-xl py-4 px-6 rounded-2xl bg-gray-900 border border-gray-800">
          <span id="testo-prenotazione" class="text-2xl font-black text-gray-400">
            🔔 BUZZER ATTIVO! In attesa di prenotazione...
          </span>
        </div>
      </div>

    </div>

    <!-- SIDEBAR CLASSIFICA -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-black text-indigo-400 uppercase tracking-wide mb-4 flex items-center space-x-2">
          <span>🏆</span>
          <span>Classifica</span>
        </h2>
        <div id="lista-classifica" class="space-y-3">
          <div class="text-gray-500 text-center py-8 font-medium">In attesa dei concorrenti...</div>
        </div>
      </div>
      <div class="mt-4 text-center text-xs text-gray-500 font-bold uppercase">
        Inserisci il PIN per entrare
      </div>
    </div>

  </main>

  <script>
    // Genera un PIN a 4 cifre immediato
    const codiceStanza = Math.floor(1000 + Math.random() * 9000).toString();

    document.addEventListener('DOMContentLoaded', () => {
      // 1. MOSTRA SUBITO IL PIN
      const elPin = document.getElementById('codice-stanza');
      if (elPin) elPin.innerText = codiceStanza;

      // 2. CONNETTI SOCKET.IO
      const socket = io();
      socket.emit('uniscitiStanza', { codiceStanza, ruoli: 'tabellone' });

      let elencoCategorie = [];

      // 3. CARICA DOMANDE
      fetch('/domande.json')
        .then(res => res.json())
        .then(data => {
          elencoCategorie = data.categorie;
          costruisciGriglia(data.categorie, socket);
        })
        .catch(err => console.error("Errore caricamento domande:", err));

      // 4. ASCOLTO EVENTI SOCKET.IO
      socket.on('aggiornaStato', (gameState) => {
        if (gameState.punteggi) aggiornaClassifica(gameState.punteggi);
        if (gameState.domandaAttiva) mostraDomanda(gameState.domandaAttiva);
        if (gameState.prenotato) mostraGiocatore(gameState.prenotato);
      });

      socket.on('apriDomanda', (data) => mostraDomanda(data));
      socket.on('giocatorePrenotato', (nick) => mostraGiocatore(nick));
      socket.on('aggiornaPunteggi', (punteggi) => aggiornaClassifica(punteggi));
      
      socket.on('chiudiDomanda', (data) => {
        aggiornaClassifica(data.punteggi);
        nascondiDomanda();
      });

      socket.on('riapriBuzzer', (punteggi) => {
        aggiornaClassifica(punteggi);
        const box = document.getElementById('box-prenotazione');
        const testo = document.getElementById('testo-prenotazione');
        if (box && testo) {
          box.className = "w-full max-w-xl py-4 px-6 rounded-2xl bg-green-950 border border-green-500";
          testo.className = "text-2xl font-black text-green-400";
          testo.innerText = "🟢 BUZZER RIAPERTO!";
        }
      });

      socket.on('resetBuzzer', () => {
        const box = document.getElementById('box-prenotazione');
        const testo = document.getElementById('testo-prenotazione');
        if (box && testo) {
          box.className = "w-full max-w-xl py-4 px-6 rounded-2xl bg-gray-900 border border-gray-800";
          testo.className = "text-2xl font-black text-gray-400";
          testo.innerText = "🔔 BUZZER ATTIVO! In attesa di prenotazione...";
        }
      });

      function costruisciGriglia(categorie, socketInstance) {
        const container = document.getElementById('griglia-tabellone');
        if (!container) return;
        container.innerHTML = '';

        categorie.forEach((cat, indexCat) => {
          let col = `<div class="flex flex-col space-y-3">
            <div class="bg-indigo-900 text-yellow-300 font-black text-center p-3 rounded-xl uppercase text-xs md:text-sm h-14 flex items-center justify-center">
              ${cat.nome}
            </div>`;

          cat.domande.forEach((d, indexDom) => {
            const btnId = `btn-${indexCat}-${indexDom}`;
            col += `
              <button id="${btnId}" 
                      class="bg-gray-950 hover:bg-yellow-500 text-yellow-400 hover:text-gray-950 font-black text-2xl py-5 rounded-2xl border border-gray-800 transition">
                ${d.punti}
              </button>`;
          });

          col += `</div>`;
          container.innerHTML += col;
        });

        // Assegna gli eventi ai pulsanti
        categorie.forEach((cat, indexCat) => {
          cat.domande.forEach((d, indexDom) => {
            const btnId = `btn-${indexCat}-${indexDom}`;
            const btn = document.getElementById(btnId);
            if (btn) {
              btn.onclick = () => {
                btn.disabled = true;
                btn.className = "bg-gray-900 text-gray-700 font-black text-2xl py-5 rounded-2xl cursor-not-allowed line-through";
                socketInstance.emit('selezionaDomanda', {
                  categoria: cat.nome,
                  punti: d.punti,
                  testo: d.testo,
                  risposta: d.risposta
                });
              };
            }
          });
        });
      }

      function mostraDomanda(data) {
        document.getElementById('domanda-categoria-punti').innerText = `${data.categoria} - ${data.punti} PT`;
        document.getElementById('domanda-testo').innerText = data.testo;
        document.getElementById('overlay-domanda').classList.remove('hidden');
        document.getElementById('overlay-domanda').classList.add('flex');
      }

      function nascondiDomanda() {
        document.getElementById('overlay-domanda').classList.remove('flex');
        document.getElementById('overlay-domanda').classList.add('hidden');
      }

      function mostraGiocatore(nick) {
        const box = document.getElementById('box-prenotazione');
        const testo = document.getElementById('testo-prenotazione');
        if (box && testo) {
          box.className = "w-full max-w-xl py-4 px-6 rounded-2xl bg-red-950 border-2 border-red-500 animate-pulse";
          testo.className = "text-3xl font-black text-red-400";
          testo.innerText = `🚨 PRENOTATO: ${nick.toUpperCase()}`;
        }
      }

      function aggiornaClassifica(punteggi) {
        const container = document.getElementById('lista-classifica');
        if (!container) return;
        const entries = Object.entries(punteggi);
        if (entries.length === 0) return;

        entries.sort((a, b) => b[1] - a[1]);

        container.innerHTML = entries.map(([nick, pt], i) => `
          <div class="flex justify-between items-center bg-gray-950 p-4 rounded-2xl border border-gray-800">
            <span class="font-bold text-white">#${i + 1} ${nick}</span>
            <span class="font-mono font-extrabold text-green-400">${pt} pt</span>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
