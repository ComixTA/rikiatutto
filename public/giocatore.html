<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rischiatutto - Giocatore</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #030712; color: #ffffff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; user-select: none; }
    
    .card { background-color: #0f172a; border: 2px solid #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .title { font-size: 24px; font-weight: 900; color: #facc15; margin-bottom: 20px; }
    
    input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #374151; background: #020617; color: #fff; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 12px; }
    input:focus { border-color: #f59e0b; outline: none; }
    
    button.btn-login { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #f59e0b; color: #000; font-weight: 900; font-size: 18px; cursor: pointer; }
    
    /* SCHERMATA GIOCO */
    #screen-game { width: 100%; max-width: 400px; text-align: center; }
    
    .player-info { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #0f172a; padding: 14px 20px; border-radius: 14px; border: 2px solid #1e293b; margin-bottom: 24px; font-weight: bold; }
    .player-pts { color: #34d399; font-family: monospace; font-size: 20px; font-weight: 900; }

    /* BUZZER ROSSO GRANDE */
    .btn-buzzer {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 8px solid #991b1b;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 0 #7f1d1d, 0 15px 25px rgba(0,0,0,0.7);
      transition: all 0.1s ease;
      margin: 10px auto 25px auto;
      display: block;
    }

    .btn-buzzer:active:not(:disabled) {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #7f1d1d, 0 8px 15px rgba(0,0,0,0.7);
    }

    .btn-buzzer:disabled {
      background: #1f2937 !important;
      border-color: #111827 !important;
      color: #4b5563 !important;
      box-shadow: none !important;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-msg { font-size: 16px; font-weight: 800; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- 1. LOGIN -->
  <div id="screen-login" class="card">
    <div class="title">🎮 RISCHIATUTTO</div>
    <input type="text" id="input-pin" maxlength="4" placeholder="Codice Stanza (PIN)">
    <input type="text" id="input-nick" placeholder="Il tuo Nickname">
    <button class="btn-login" onclick="entraInPartita()">ENTRA IN PARTITA</button>
  </div>

  <!-- 2. GAMEPLAY / BUZZER (INIZIALMENTE NASCOSTO) -->
  <div id="screen-game" style="display: none;">
    <div class="player-info">
      <span id="display-nick">NICKNAME</span>
      <span id="display-punti" class="player-pts">0 pt</span>
    </div>

    <button id="btn-buzzer" class="btn-buzzer" onclick="premiBuzzer()" disabled>
      PREMI!
    </button>

    <div id="status-msg" class="status-msg">In attesa che la Regia o il Tabellone aprano una domanda...</div>
  </div>

  <script>
    let socket;
    let mioNick = "";
    let codiceStanza = "";

    function entraInPartita() {
      const pin = document.getElementById('input-pin').value.trim();
      const nick = document.getElementById('input-nick').value.trim();

      if (!pin || !nick) return alert("Inserisci sia il PIN che il Nickname!");

      codiceStanza = pin;
      mioNick = nick;

      try {
        socket = io();
      } catch (e) {
        alert("Errore di connessione al Server Socket.IO");
        return;
      }

      // CAMBIO SCHERMATA FORZATO
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-game').style.display = 'block';
      document.getElementById('display-nick').innerText = mioNick.toUpperCase();

      // INVIA DATI AL SERVER
      socket.emit('uniscitiStanza', {
        codiceStanza: codiceStanza,
        nickname: mioNick,
        ruolo: 'giocatore'
      });

      // EVENTI SOCKET
      socket.on('aggiornaStato', (gameState) => {
        if (gameState && gameState.punteggi && gameState.punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${gameState.punteggi[mioNick]} pt`;
        }
        if (gameState && gameState.domandaAttiva && !gameState.prenotato) {
          attivaBuzzer();
        }
      });

      socket.on('aggiornaPunteggi', (punteggi) => {
        if (punteggi && punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${punteggi[mioNick]} pt`;
        }
      });

      socket.on('apriDomanda', () => {
        attivaBuzzer();
      });

      socket.on('giocatorePrenotato', (nick) => {
        const btn = document.getElementById('btn-buzzer');
        btn.disabled = true;

        const msg = document.getElementById('status-msg');
        if (nick.toLowerCase() === mioNick.toLowerCase()) {
          msg.innerText = "🚨 TI SEI PRENOTATO!\nRispondi a voce!";
          msg.style.color = "#facc15";
        } else {
          msg.innerText = `🔒 Si è prenotato ${nick.toUpperCase()}`;
          msg.style.color = "#ef4444";
        }
      });

      socket.on('riapriBuzzer', (punteggi) => {
        if (punteggi && punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${punteggi[mioNick]} pt`;
        }
        attivaBuzzer();
      });

      socket.on('chiudiDomanda', (data) => {
        disattivaBuzzer();
        if (data && data.punteggi && data.punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${data.punteggi[mioNick]} pt`;
        }
      });

      socket.on('resetBuzzer', () => {
        attivaBuzzer();
      });
    }

    function attivaBuzzer() {
      const btn = document.getElementById('btn-buzzer');
      btn.disabled = false;
      const msg = document.getElementById('status-msg');
      msg.innerText = "🟢 BUZZER ATTIVO!\nPremi il pulsante per rispondere!";
      msg.style.color = "#34d399";
    }

    function disattivaBuzzer() {
      const btn = document.getElementById('btn-buzzer');
      btn.disabled = true;
      const msg = document.getElementById('status-msg');
      msg.innerText = "In attesa della prossima domanda...";
      msg.style.color = "#94a3b8";
    }

    function premiBuzzer() {
      if (socket) {
        socket.emit('prenotaBuzzer');
      }
    }
  </script>
</body>
</html>
