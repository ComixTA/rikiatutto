<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rischiatutto - Concorrente</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-4">

  <!-- LOGIN: PIN + NICKNAME -->
  <div id="screen-join" class="my-auto max-w-sm w-full mx-auto bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center shadow-2xl space-y-4">
    <h1 class="text-3xl font-black text-amber-400">⚡ RISCHIATUTTO</h1>
    
    <div>
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest block text-left mb-1">PIN Stanza</label>
      <input type="number" id="input-pin" placeholder="1234" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-2xl text-center text-2xl font-black font-mono text-emerald-400 focus:outline-none focus:border-emerald-400">
    </div>

    <div>
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest block text-left mb-1">Nickname</label>
      <input type="text" id="input-nickname" placeholder="Il tuo Nome" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-2xl text-center text-xl font-bold text-white focus:outline-none focus:border-amber-400">
    </div>
    
    <button onclick="entraInGioco()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-lg py-4 rounded-2xl transition shadow-lg active:scale-95">
      ENTRA IN PARTITA
    </button>
  </div>

  <!-- SCHERMATA BUZZER (Hidden all'inizio) -->
  <div id="screen-game" class="hidden flex-col justify-between h-full min-h-[90vh] w-full max-w-md mx-auto">
    <header class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div>
        <span id="player-nick" class="text-xl font-black text-white">---</span>
        <span id="display-pin-game" class="text-xs text-emerald-400 font-mono block">PIN: ----</span>
      </div>
      <div class="text-right">
        <span id="player-punti" class="text-2xl font-black text-amber-400 font-mono">0 pt</span>
      </div>
    </header>

    <div class="my-auto flex flex-col items-center justify-center">
      <button id="btn-buzzer" onclick="premiBuzzer()" disabled class="w-64 h-64 rounded-full bg-slate-800 border-8 border-slate-700 text-slate-600 font-black text-5xl">
        BUZZ!
      </button>
      <div id="status-feedback" class="mt-8 text-center text-lg font-bold text-slate-400 px-4 py-3 rounded-2xl bg-slate-900 border border-slate-800 w-full">
        In attesa della domanda...
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let mioNickname = "";
    let pinStanza = "";

    // Legge eventuale PIN dall'URL (se passato via QR Code)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pinParam = urlParams.get('pin');
      if (pinParam) {
        document.getElementById('input-pin').value = pinParam;
      }
    });

    function entraInGioco() {
      pinStanza = document.getElementById('input-pin').value.trim();
      mioNickname = document.getElementById('input-nickname').value.trim();

      if (!pinStanza || !mioNickname) {
        alert("Inserisci sia il PIN che il Nickname!");
        return;
      }

      socket.emit('uniscitiStanza', { pin: pinStanza, nickname: mioNickname, ruolo: 'giocatore' });
    }

    socket.on('statoIniziale', (stanza) => {
      document.getElementById('player-nick').innerText = mioNickname;
      document.getElementById('display-pin-game').innerText = `PIN: ${pinStanza}`;
      document.getElementById('screen-join').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      document.getElementById('screen-game').classList.add('flex');
    });

    socket.on('erroreIngresso', (msg) => {
      alert(msg);
    });

    function premiBuzzer() {
      socket.emit('pressBuzzer');
    }

    // [Mantieni qui tutti gli altri socket.on del pulsante: apriDomanda, giocatorePrenotato, ecc.]
  </script>
</body>
</html>
