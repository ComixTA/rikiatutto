<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rischiatutto - Pulsantiera Giocatore</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #030712; color: #ffffff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; user-select: none; }
    
    .card { background-color: #0f172a; border: 2px solid #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .title { font-size: 24px; font-weight: 900; color: #facc15; margin-bottom: 20px; }
    
    input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #374151; background: #020617; color: #fff; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 12px; }
    input:focus { border-color: #f59e0b; outline: none; }
    
    button.btn-login { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #f59e0b; color: #000; font-weight: 900; font-size: 18px; cursor: pointer; }
    
    /* PULSANTE BUZZER */
    .buzzer-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
    .player-info { display: flex; justify-content: space-between; width: 100%; background: #0f172a; padding: 12px 20px; border-radius: 14px; border: 1px solid #1e293b; margin-bottom: 20px; font-weight: bold; }
    .player-pts { color: #34d399; font-family: monospace; font-size: 18px; }

    .btn-buzzer {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 8px solid #991b1b;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 0 #7f1d1d, 0 15px 20px rgba(0,0,0,0.6);
      transition: all 0.1s ease;
      margin: 20px 0;
    }

    .btn-buzzer:active:not(:disabled) {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #7f1d1d, 0 8px 10px rgba(0,0,0,0.6);
    }

    .btn-buzzer:disabled {
      background: #374151;
      border-color: #1f2937;
      color: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg { font-size: 16px; font-weight: bold; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- SCHERMATA DI LOGIN -->
  <div id="screen-login" class="card">
    <div class="title">🎮 UNISCITI ALLA PARTITA</div>
    <input type="text" id="input-pin" maxlength="4" placeholder="Codice Stanza (PIN)">
    <input type="text" id="input-nick" placeholder="Il tuo Nickname">
    <button class="btn-login" onclick="entraInPartita()">ENTRA</button>
  </div>

  <!-- SCHERMATA GAMEPLAY / BUZZER -->
  <div id="screen-game" class="buzzer-container" style="display: none;">
    <div class="player-info">
      <span id="display-nick">---</span>
      <span id="display-punti" class="player-pts">0 pt</span>
    </div>

    <button id="btn-buzzer" class="btn-buzzer" onclick="premiBuzzer()" disabled>
      PREMIMI!
    </button>

    <div id="status-msg" class="status-msg">In attesa che venga aperta una domanda...</div>
  </div>

  <script>
    let socket;
    let mioNick = "";
    let codiceStanza = "";

    function entraInPartita() {
      const pin = document.getElementById('input-pin').value.trim();
      const nick = document.getElementById('input-nick').value.trim();

      if (!pin || !nick) return alert("Inserisci sia il PIN che il Nickname!");

      codiceStanza = pin;
      mioNick = nick;

      socket = io();

      // Invia i dati esatti attesi da server.js
      socket.emit('uniscitiStanza', {
        codiceStanza: codiceStanza,
        nickname: mioNick,
        ruolo: 'giocatore'
      });

      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-game').style.display = 'flex';
      document.getElementById('display-nick').innerText = mioNick.toUpperCase();

      // GESTIONE EVENTI SOCKET
      socket.on('aggiornaPunteggi', (punteggi) => {
        if (punteggi && punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${punteggi[mioNick]} pt`;
        }
      });

      socket.on('apriDomanda', () => {
        const btn = document.getElementById('btn-buzzer');
        btn.disabled = false;
        document.getElementById('status-msg').innerText = "🟢 DOMANDA ATTIVA! Premi il buzzer!";
        document.getElementById('status-msg').style.color = "#34d399";
      });

      socket.on('giocatorePrenotato', (nick) => {
        const btn = document.getElementById('btn-buzzer');
        btn.disabled = true;

        if (nick.toLowerCase() === mioNick.toLowerCase()) {
          document.getElementById('status-msg').innerText = "🚨 TI SEI PRENOTATO! Rispondi a voce!";
          document.getElementById('status-msg').style.color = "#facc15";
        } else {
          document.getElementById('status-msg').innerText = `🔒 Si è prenotato ${nick.toUpperCase()}`;
          document.getElementById('status-msg').style.color = "#ef4444";
        }
      });

      socket.on('riapriBuzzer', (punteggi) => {
        if (punteggi && punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${punteggi[mioNick]} pt`;
        }
        const btn = document.getElementById('btn-buzzer');
        btn.disabled = false;
        document.getElementById('status-msg').innerText = "🟢 BUZZER RIAPERTO! Puoi prenotarti!";
        document.getElementById('status-msg').style.color = "#34d399";
      });

      socket.on('chiudiDomanda', (data) => {
        const btn = document.getElementById('btn-buzzer');
        btn.disabled = true;
        document.getElementById('status-msg').innerText = "In attesa della prossima domanda...";
        document.getElementById('status-msg').style.color = "#94a3b8";

        if (data && data.punteggi && data.punteggi[mioNick] !== undefined) {
          document.getElementById('display-punti').innerText = `${data.punteggi[mioNick]} pt`;
        }
      });
    }

    function premiBuzzer() {
      if (socket) {
        socket.emit('prenotaBuzzer');
      }
    }
  </script>
</body>
</html>
